<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Shades of Gray</title>

    <link rel="stylesheet" href="src/styles.css">

    <meta name="description" content="Play Shades of Gray, a minimalist arcade game where you shoot, bounce, and grow gray balls while chasing your high score." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shades of Gray" />
    <meta property="og:description" content="Play Shades of Gray, a minimalist arcade game where you shoot, bounce, and grow gray balls while chasing your high score." />
    <meta property="og:url" content="https://shades-of-grey.netlify.app" />
    <meta property="og:locale" content="en_US" />

    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#111">
  </head>
  <body>
    <main>
      <canvas id="game"></canvas>
      <section id="panel">
        <button type="button" id="menu">⚙️</button>
        <div>Score: <span id="score">0</span></div>
        <div>Last: <span id="last">0</span></div>
        <div>Best: <span id="best">0</span></div>
      </section>

      <dialog id="menu-dialog">
        <h2>Shades of Gray</h2>
        <section>
          <label>
            <input type="checkbox" id="sound">
            Sound
          </label>
          <nav>
            <button type="button" id="new-game">New Game</button>
            <button type="button" id="leaderboard">Leaderboard</button>
            <a href="https://github.com/VChet/shades-of-gray" target="_blank" class="button">Source Code</a>
            <button type="button" data-close>Close</button>
          </nav>
        </section>
      </dialog>

      <dialog id="leaderboard-dialog">
        <h2>Leaderboard</h2>
        <section>
          <ol id="leaderboard-list"></ol>
          <button type="button" data-close>Close</button>
        </section>
      </dialog>
    </main>

    <script type="importmap">{ "imports": { "zzfx": "https://esm.sh/zzfx@1.3.0" } }</script>
    <script src="src/index.js" type="module"></script>
  </body>
</html>
