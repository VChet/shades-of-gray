<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Shades of Gray</title>

    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <main>
      <canvas id="game"></canvas>
      <section id="panel">
        <button type="button" id="menu">⚙️</button>
        <div>Score: <span id="score">0</span></div>
        <div>Last: <span id="last">0</span></div>
        <div>Best: <span id="best">0</span></div>
      </section>

      <dialog id="menu-dialog">
        <h2>Shades of Gray</h2>
        <div>
          <label>
            <input type="checkbox" id="sound">
            Sound
          </label>
        </div>
        <nav>
          <button type="button" id="new-game">New Game</button>
          <button type="button" id="leaderboard">Leaderboard</button>
          <button type="button" id="hot-seat" disabled>Hot Seat</button>
          <button type="button" id="online" disabled>Online</button>
          <button type="button" id="terms-of-use" disabled>Terms of Use</button>
          <button type="button" id="privacy-policy" disabled>Privacy Policy</button>
          <button type="button" data-close>Close</button>
        </nav>
      </dialog>

      <dialog id="leaderboard-dialog">
        <h2>Leaderboard</h2>
        <div>
          <ol id="leaderboard-list"></ol>
          <button type="button" data-close>Close</button>
        </div>
      </dialog>
    </main>

    <script type="importmap">{ "imports": { "zzfx": "https://esm.sh/zzfx@1.3.0" } }</script>
    <script src="src/index.js" type="module"></script>
  </body>
</html>
